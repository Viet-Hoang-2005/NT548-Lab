name: "CloudFormation Validate"

on:
  pull_request:
    branches:
      - main
    paths:
      - 'infra/cloudformation/**'

env:
  AWS_REGION: ap-southeast-1

jobs:
  cloudformation-validate:
    name: "CloudFormation Validate"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    defaults:
      run:
        working-directory: infra/cloudformation

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.IAM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install cfn-lint
        run: python -m pip install --upgrade pip cfn-lint

      - name: Run cfn-lint
        id: lint
        run: |
          cfn-lint main.yaml \
            modules/vpc/vpc.yaml \
            modules/security-group/security-group.yaml \
            modules/ec2/ec2.yaml \
            modules/alb/alb.yaml
        continue-on-error: true

      - name: Validate CloudFormation Templates
        id: validate
        run: |
          aws cloudformation validate-template --template-body file://main.yaml
          aws cloudformation validate-template --template-body file://modules/vpc/vpc.yaml
          aws cloudformation validate-template --template-body file://modules/security-group/security-group.yaml
          aws cloudformation validate-template --template-body file://modules/ec2/ec2.yaml
          aws cloudformation validate-template --template-body file://modules/alb/alb.yaml
        continue-on-error: true

      - name: Comment PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### CloudFormation Lint \`${{ steps.lint.outcome }}\`
            #### CloudFormation Validate \`${{ steps.validate.outcome }}\`

            Checked templates under \`infra/cloudformation\`.

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Check CloudFormation Status
        if: steps.lint.outcome == 'failure' || steps.validate.outcome == 'failure'
        run: exit 1
