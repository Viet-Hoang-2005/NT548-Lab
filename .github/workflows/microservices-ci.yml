name: Microservices CI

on:
  push:
    branches:
      - main
    paths:
      - "services/**"
      - "k8s/**"
      - "sonar-project.properties"
      - ".github/path-filters.yml"
      - ".github/workflows/microservices-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "services/**"
      - "k8s/**"
      - "sonar-project.properties"
      - ".github/path-filters.yml"
      - ".github/workflows/microservices-ci.yml"
  workflow_dispatch:

env:
  TRIVY_DISABLE_VEX_NOTICE: "true"
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}

jobs:
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
      k8s: ${{ steps.filter.outputs.k8s }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: .github/path-filters.yml

      - name: Build service matrix
        id: matrix
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GATEWAY: ${{ steps.filter.outputs.gateway }}
          AUTH_SERVICE: ${{ steps.filter.outputs.auth_service }}
          COURSE_SERVICE: ${{ steps.filter.outputs.course_service }}
          SONAR: ${{ steps.filter.outputs.sonar }}
          WORKFLOW_CI: ${{ steps.filter.outputs.workflow_ci }}
        run: |
          set -euo pipefail

          services=()

          add_service() {
            services+=("{\"name\":\"$1\",\"dir\":\"$2\"}")
          }

          add_all_services() {
            add_service "gateway" "services/gateway"
            add_service "auth-service" "services/auth-service"
            add_service "course-service" "services/course-service"
          }

          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$SONAR" == "true" || "$WORKFLOW_CI" == "true" ]]; then
            add_all_services
          else
            [[ "$GATEWAY" == "true" ]] && add_service "gateway" "services/gateway"
            [[ "$AUTH_SERVICE" == "true" ]] && add_service "auth-service" "services/auth-service"
            [[ "$COURSE_SERVICE" == "true" ]] && add_service "course-service" "services/course-service"
          fi

          if [[ "${#services[@]}" -eq 0 ]]; then
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            echo "count=0" >> "$GITHUB_OUTPUT"
          else
            matrix="$(printf '%s\n' "${services[@]}" | jq -c -s '{include: .}')"
            echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
            echo "count=${#services[@]}" >> "$GITHUB_OUTPUT"
          fi

  build-test-scan:
    name: CI - Build, Test and Scan ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.count != '0'

    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare image name
        id: image
        run: |
          REPOSITORY="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE_NAME="ghcr.io/${REPOSITORY}/${{ matrix.name }}"
          echo "IMAGE_NAME=${IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run unit tests
        working-directory: ${{ matrix.dir }}
        run: |
          chmod +x mvnw
          ./mvnw -B test --no-transfer-progress

      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_ORGANIZATION != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}_${{ matrix.name }}
            -Dsonar.projectName=${{ matrix.name }}
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.sources=src/main/java
            -Dsonar.tests=src/test/java
            -Dsonar.java.binaries=target/classes
            -Dsonar.projectBaseDir=${{ matrix.dir }}

      - name: Skip Sonar scan
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "SONAR_TOKEN is not configured; skipping Sonar scan for ${{ matrix.name }}."

      - name: Skip SonarQube scan on GitHub-hosted runner
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_ORGANIZATION == '' && env.SONAR_HOST_URL != '' }}
        run: echo "SonarQube self-hosted scan runs in the sonarqube-scan-self-hosted job."

      - name: Skip Sonar scan because target is not configured
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_ORGANIZATION == '' && env.SONAR_HOST_URL == '' }}
        run: echo "SONAR_TOKEN is configured, but SONAR_ORGANIZATION or SONAR_HOST_URL is missing; skipping Sonar scan for ${{ matrix.name }}."

      - name: Build Docker image locally
        run: |
          docker build \
            -t "${IMAGE_NAME}:${GITHUB_SHA}" \
            "${{ matrix.dir }}"

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          version: v0.71.0

  sonarqube-scan-self-hosted:
    name: SonarQube self-hosted scan ${{ matrix.name }}
    runs-on: self-hosted
    needs: detect-changes
    if: needs.detect-changes.outputs.count != '0' && vars.SONAR_ORGANIZATION == ''

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Skip SonarQube scan because it is not configured
        if: ${{ env.SONAR_TOKEN == '' || env.SONAR_HOST_URL == '' }}
        run: echo "SONAR_TOKEN or SONAR_HOST_URL is not configured; skipping SonarQube scan for ${{ matrix.name }}."

      - name: Checkout source
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        uses: actions/checkout@v4

      - name: Set up Java
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Check SonarQube connectivity
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        run: curl -fsS "${SONAR_HOST_URL}/api/system/status"

      - name: Run unit tests for Sonar binaries
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        working-directory: ${{ matrix.dir }}
        run: |
          chmod +x mvnw
          ./mvnw -B test --no-transfer-progress

      - name: SonarQube scan from self-hosted runner
        if: ${{ env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }}_${{ matrix.name }}
            -Dsonar.projectName=${{ matrix.name }}
            -Dsonar.sources=src/main/java
            -Dsonar.tests=src/test/java
            -Dsonar.java.binaries=target/classes
            -Dsonar.projectBaseDir=${{ matrix.dir }}
